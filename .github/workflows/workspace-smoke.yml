name: Python Lab Workspace Smoke Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Python Lab JavaScript and simulated terminal
        run: node tests/workspace-smoke.mjs
      - name: Validate Pyodide worker contracts and Python parser code
        run: node tests/worker-contract.mjs
      - name: Validate recorded debugger and classroom projects
        run: node tests/debugger-smoke.mjs
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exercise recorded trace integration
        run: python3 tests/python-trace-smoke.py
      - name: Validate browser project storage and migration
        run: node tests/project-store.mjs
      - name: Validate classroom project switching and assignment links
        run: node tests/classroom-projects.mjs
      - name: Verify 41 CS50P scaffold files and searchable template gallery
        run: node tests/cs50p-starters.mjs
      - name: Test CS50 official submission handoff and browser-only safeguards
        run: node tests/cs50-tools.mjs
