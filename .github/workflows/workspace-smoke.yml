name: Python Lab Workspace Smoke Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Python Lab JavaScript and simulated terminal
        run: node tests/workspace-smoke.mjs
      - name: Validate Pyodide worker contracts and Python parser code
        run: node tests/worker-contract.mjs
