<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Python Lab Game Runner</title>
<style>body{margin:0;background:#101827;color:white;font:14px sans-serif;text-align:center}canvas{display:block;max-width:100%;max-height:70vh;margin:auto;object-fit:contain;outline-offset:-2px}#status{padding:8px}button{padding:10px;margin:4px;background:#334155;color:white;border:1px solid #64748b;border-radius:5px;touch-action:none}.controls{touch-action:none}</style>
</head><body><div id="status" role="status">Loading game runtime…</div><canvas id="canvas" width="640" height="480" tabindex="0" aria-label="Game canvas. Click here to use the keyboard."></canvas><div class="controls"><button data-key="ArrowLeft">◀ Left</button><button data-key="Space">Launch</button><button data-key="ArrowRight">Right ▶</button><button data-key="KeyR">Restart</button></div>
<script src="https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js"></script><script src="pygame-runner.js?v=1"></script></body></html>
